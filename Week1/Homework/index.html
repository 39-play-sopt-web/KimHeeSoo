<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8"  />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="PLAY SOPT YB 39기 Web 김희수" />
        <title> 김희수 </title>

        <link rel="stylesheet" href="./styles/reset.css" />
        <link rel="stylesheet" href="./styles/layout.css" />
        <link rel="stylesheet" href="./styles/footer.css" />
        <link rel="stylesheet" href="./styles/header.css" />
        <link rel="stylesheet" href="./styles/navigation.css"/>
        <link rel="stylesheet" href="./styles/photo-dump.css"/>
        <link rel="stylesheet" href="./styles/album.css"/>
        <link rel="stylesheet" href="./styles/interests.css"/>
        <link rel="stylesheet" href="./styles/message.css"/>
    </head>

    <body>
        <header class="header">
            <img class="avatar" src="./assets/avatar.jpg" alt="희수 프로필 사진" />
            <h1 class="title"> 김 희 수 </h1>
            <a class="social" href="https://github.com/kimxeesoo" target="_blank" rel="noopener noreferrer">
                <img src="./assets/github.jpg" alt="GitHub" />
                </a>   
        </header>

        <div class="container">
            <nav class="side-nav">
                <ul>
                    <li><a href="#photo-dump">포토 덤프</a></li>
                    <li><a href="#album">좋아하는 것</a></li>
                    <li><a href="#interests">내 관심사</a></li>
                    <li><a href="#to-webtory">To. 웹토리</a></li>
                </ul>
            </nav>

            <main class="content">

                <section class="section" id="photo-dump">
                    <h2 class="section-title">포토 덤프</h2>
                    <div class="photo-dump">
                        <figure class="photo photo-a"><img src="./assets/photo1.jpg" alt="포토 덤프 사진 1" /></figure>
                        <figure class="photo photo-b"><img src="./assets/photo2.jpg" alt="포토 덤프 사진 2" /></figure>
                        <figure class="photo photo-c"><img src="./assets/photo3.jpg" alt="포토 덤프 사진 3" /></figure>
                        <figure class="photo photo-d"><img src="./assets/photo4.jpg" alt="포토 덤프 사진 4" /></figure>
                        <figure class="photo photo-e"><img src="./assets/photo5.jpg" alt="포토 덤프 사진 5" /></figure>
                        <figure class="photo photo-f"><img src="./assets/photo6.jpg" alt="포토 덤프 사진 6" /></figure>

                    </div>
                </section>

                <section class="section" id="album">
                    <h2 class="section-title">좋아하는 것: 망그러진 곰</h2>
                    <div class="album">
                        <img src="./assets/album1.png" alt="사진첩 1"/>
                        <img src="./assets/album2.png" alt="사진첩 2"/>
                        <img src="./assets/album3.png" alt="사진첩 3"/>
                        <img src="./assets/album4.jpg" alt="사진첩 4"/>
                        <img src="./assets/album5.png" alt="사진첩 5"/>
                        <img src="./assets/album6.png" alt="사진첩 6"/>
                        <img src="./assets/album7.png" alt="사진첩 7"/>
                    </div>
                </section>

                <section class="section" id="interests">
                    <h2 class="section-title">내 관심사</h2>
                    <div class="cards">
                        <article class="card">
                            <img class="card-img" src="" alt="여행"/>
                            <h3 class="card-title">여행</h3>
                            <div class="card-buttons">
                                <button type="button" class="btn-like">좋아요</button>
                                <button type="button" class="btn-dislike">싫어요</button>
                            </div>
                        </article>
                        <article class="card">
                            <img class="card-img" src="" alt="야구"/>
                            <h3 class="card-title">야구</h3>
                            <div class="card-buttons">
                                <button type="button" class="btn-like">좋아요</button>
                                <button type="button" class="btn-dislike">싫어요</button>
                            </div>
                        </article>
                        <article class="card">
                            <img class="card-img" src="" alt="산책"/>
                            <h3 class="card-title">산책</h3>
                            <div class="card-buttons">
                                <button type="button" class="btn-like">좋아요</button>
                                <button type="button" class="btn-dislike">싫어요</button>
                            </div>
                        </article>
                        <article class="card">
                            <img class="card-img" src="" alt="야경"/>
                            <h3 class="card-title">야경</h3>
                            <div class="card-buttons">
                                <button type="button" class="btn-like">좋아요</button>
                                <button type="button" class="btn-dislike">싫어요</button>
                            </div>
                        </article>
                        <article class="card">
                            <img class="card-img" src="" alt="음악"/>
                            <h3 class="card-title">음악</h3>
                            <div class="card-buttons">
                                <button type="button" class="btn-like">좋아요</button>
                                <button type="button" class="btn-dislike">싫어요</button>
                            </div>
                        </article>
                        <article class="card">
                            <img class="card-img" src="" alt="독서"/>
                            <h3 class="card-title">독서</h3>
                            <div class="card-buttons">
                                <button type="button" class="btn-like">좋아요</button>
                                <button type="button" class="btn-dislike">싫어요</button>
                            </div>
                        </article>
                        <article class="card">
                            <img class="card-img" src="" alt="음식"/>
                            <h3 class="card-title">음식</h3>
                            <div class="card-buttons">
                                <button type="button" class="btn-like">좋아요</button>
                                <button type="button" class="btn-dislike">싫어요</button>
                            </div>
                        </article>
                        <article class="card">
                            <img class="card-img" src="" alt="영화"/>
                            <h3 class="card-title">영화</h3>
                            <div class="card-buttons">
                                <button type="button" class="btn-like">좋아요</button>
                                <button type="button" class="btn-dislike">싫어요</button>
                            </div>
                        </article>   
                    </div>
                </section>

                <section class="section" id="to-webtory">
                    <h2 class="section-title">To. 웹토리</h2>
                    <div class="letter">
                        <p>웹토리 반가워요</p>
                        <p>저는 김희수입니다.</p>
                        <p>많이 배우고 성장하고 싶어요!</p>
                    </div>
                </section>
            </main>
        </div>
         
        <footer class="footer">
            <p>방가방가 웹토리</p>
        </footer>
    </body>
</html>
